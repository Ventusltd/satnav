name: Agent 24 router prototype
on:
  pull_request:
    paths:
      - 'src/router/**'
      - 'test/router-grid.test.mjs'
      - 'test/router-contract.test.mjs'
      - 'test/route-follower.test.mjs'
      - '.github/workflows/agent24-router-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/router/grid-search.mjs
      - run: node test/router-grid.test.mjs

      - run: node --check src/router/contract-adapter.mjs
      - run: node test/router-contract.test.mjs

      - uses: actions/checkout@v4
        with:
          repository: Ventusltd/grid-distance-maths
          ref: 8e91b07d8312acca5bcaef43e839f06a3b1d642a
          path: .canonical-maths
          persist-credentials: false
      - run: node --check src/router/route-follower.mjs
      - run: node test/route-follower.test.mjs .canonical-maths/src/geodesy.mjs
