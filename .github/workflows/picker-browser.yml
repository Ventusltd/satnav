name: SatNav picker Chromium WebKit regression
on:
  push:
    branches: ['agent22/satnav-contracts-20261124']
    paths: ['nav/**', '.github/workflows/picker-browser.yml']
  pull_request:
    paths: ['nav/**', '.github/workflows/picker-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: satnav-picker-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing coordinate contract and picker state assertions
        run: node --test nav/contracts.test.mjs
      - name: Install Chromium and WebKit test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - name: Cross-browser picker acceptance (fixture data, synthetic GPS only)
        run: python nav/picker-browser.test.py
