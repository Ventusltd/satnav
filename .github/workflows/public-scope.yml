name: SatNav public landing page
on:
  pull_request:
    paths: ['scope/**', '.github/workflows/public-scope.yml']
  push:
    paths: ['scope/**', '.github/workflows/public-scope.yml']
permissions:
  contents: read
concurrency:
  group: satnav-scope-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium webkit
      - name: Test public scope, exact palette, mobile layout and feed failure
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json, threading, http.server, subprocess, hashlib
          from collections import Counter
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          html=Path('scope/index.html').read_text()
          baseline='19737b9975495aebb4bd247e39c6509151fb576f'
          prior=subprocess.check_output(['git','show',baseline+':scope/index.html']).decode()
          assert 'Development preview — GPS prototype available' in html
          assert '(concept only stage)' not in html
          assert html.split('<script type="module">')[1]==prior.split('<script type="module">')[1], 'Ticker script changed'
          assert html.split('<style>')[1].startswith(prior.split('<style>')[1].split('</style>')[0]), 'Existing CSS changed'
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.links.extend(v for k,v in attrs if k=='href')
          before=Links();before.feed(prior)
          after=Links();after.feed(html)
          gps='https://ventusltd.github.io/satnav/preview/9698781539e549deaa6ecaa4a2b34610c1f9fd29/nav/'
          assert Counter(after.links)==Counter(before.links)+Counter([gps]), 'Existing links lost or replaced'
          changed=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          assert set(changed)<= {'scope/index.html','.github/workflows/public-scope.yml'}, changed
          p1=Path('preview/9698781539e549deaa6ecaa4a2b34610c1f9fd29')
          manifest=json.loads((p1/'manifest.json').read_text())
          assert len(manifest['files'])==7
          def get(url):
              with urlopen(Request(url,headers={'Accept-Encoding':'identity','Cache-Control':'no-cache','User-Agent':'GlobalGrid2050-scope-regression'}),timeout=15) as r:
                  assert r.status==200,url
                  return r.read()
          for f in manifest['files']:
              data=(p1/f['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==f['sha256'],f['path']
              assert get(gps.rsplit('nav/',1)[0]+f['path'])==data,f['path']
          assert get(gps)==(p1/'nav/index.html').read_bytes()
          assert b'https://ventusltd.github.io/satnav/scope/' in get('https://www.globalgrid2050.com/')
          print('PASS seven immutable public files, entry, homepage connection; retained',len(before.links),'existing static links',flush=True)
          for forbidden in ('Neural Link','Agent 22','Agent 23','Agent 24','Agent 28','swarm','CI/CD'):
              assert forbidden.lower() not in html.lower(), forbidden
          for value in ('--bg:#000','--panel:#0b0e14','--accent:#00ffff','--text:#fff','#ff3038'):
              assert value in html, value
          assert 'England, Scotland, Wales and Northern Ireland' in html
          srv=http.server.ThreadingHTTPServer(('127.0.0.1',0),http.server.SimpleHTTPRequestHandler)
          threading.Thread(target=srv.serve_forever,daemon=True).start()
          url=f'http://127.0.0.1:{srv.server_port}/scope/'
          fixture={'schema':'globalgrid2050.news.pipeline-headlines.v1','generated_at':'2026-11-24T03:01:20Z','status':'partial','items':[{'title':'Grid fixture','source':'Test publisher','link':'https://example.com/story','date':'2026-11-24T00:00:00Z'},{'title':'Unsafe fixture','source':'Test','link':'javascript:alert(1)'},{'title':'Duplicate fixture','source':'Test','link':'https://example.com/story'}]}
          with sync_playwright() as p:
              for name in ('chromium','webkit'):
                  browser=getattr(p,name).launch()
                  for width,height in [(1440,900),(390,844),(844,390),(320,568)]:
                      page=browser.new_page(viewport={'width':width,'height':height},reduced_motion='reduce')
                      errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      page.route('https://raw.githubusercontent.com/**',lambda r:r.fulfill(status=200,content_type='application/json',headers={'access-control-allow-origin':'*'},body=json.dumps(fixture)))
                      page.goto(url)
                      page.locator('.pn-ticker-title').first.wait_for()
                      assert page.locator('h1').inner_text()=='SatNav'
                      assert page.locator('.launch-card').count()==3
                      launch=page.locator('#launch-gps')
                      assert launch.get_attribute('href')==gps
                      assert launch.inner_text()=='Launch SatNav — GPS prototype'
                      assert launch.bounding_box()['height']>=44
                      assert launch.evaluate('(e)=>getComputedStyle(e).color')=='rgb(0, 255, 255)'
                      for id_,description in [('launch-gridatlas','gridatlas-status'),('launch-line','line-status')]:
                          item=page.locator('#'+id_)
                          assert item.is_disabled()
                          assert item.get_attribute('aria-describedby')==description
                          assert item.bounding_box()['height']>=44
                          assert not item.evaluate('(e)=>{e.focus();return document.activeElement===e}')
                      launch.focus()
                      assert launch.evaluate('(e)=>document.activeElement===e')
                      assert page.locator('.launch-card').first.evaluate('(e)=>getComputedStyle(e).borderColor')=='rgb(0, 255, 255)'
                      page.route(gps,lambda route:route.fulfill(status=200,content_type='text/html',body='<title>GPS launch target</title>'))
                      launch.press('Enter')
                      page.wait_for_url(gps)
                      assert page.title()=='GPS launch target'
                      page.goto(url)
                      page.locator('.pn-ticker-title').first.wait_for()
                      assert page.locator('.pn-ticker-cycle:not(.pn-ticker-copy) a').count()==1
                      assert 'Test publisher' in page.locator('.pn-ticker-title').first.inner_text()
                      assert 'partial collection' in page.locator('#newsStatus').inner_text()
                      assert page.evaluate('document.documentElement.scrollWidth <= innerWidth')
                      assert page.locator('body').evaluate('(e)=>getComputedStyle(e).backgroundColor')=='rgb(0, 0, 0)'
                      assert page.locator('h1').evaluate('(e)=>getComputedStyle(e).color')=='rgb(0, 255, 255)'
                      page.locator('#pauseTicker').click()
                      assert page.locator('#pauseTicker').get_attribute('aria-pressed')=='true'
                      page.locator('#pauseTicker').click()
                      assert page.locator('#pauseTicker').get_attribute('aria-pressed')=='false'
                      assert not errors,errors
                      page.close()
                  for mode in ('snapshot','offline'):
                      page=browser.new_page(viewport={'width':390,'height':844})
                      def reply(route):
                          if mode=='snapshot' and 'snapshot.json' in route.request.url:
                              route.fulfill(status=200,content_type='application/json',headers={'access-control-allow-origin':'*'},body=json.dumps(fixture))
                          else: route.fulfill(status=503,headers={'access-control-allow-origin':'*'},body='unavailable')
                      page.route('https://raw.githubusercontent.com/**',reply)
                      page.goto(url)
                      page.wait_for_function("(mode)=>document.getElementById('newsStatus').textContent.includes(mode)",arg='Saved snapshot' if mode=='snapshot' else 'Headline feed unavailable')
                      page.close()
                  browser.close()
          print('PASS: 8 browser/viewport cases, 4 feed fallback cases; launch, disabled entries, accessibility, retained palette, layout, ticker and links.')
          srv.shutdown()
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run exact pinned CVAA on baseline and candidate, retain actual findings
        shell: bash
        run: |
          set -eu
          mkdir -p /tmp/satnav-scope-cvaa /tmp/satnav-scope-receipts
          git -C /tmp/satnav-scope-cvaa init -q
          git -C /tmp/satnav-scope-cvaa fetch --depth=1 https://github.com/Ventusltd/cvaa.git b124c39e5343b24dd5b546a0c279a1c06360bdad
          git -C /tmp/satnav-scope-cvaa checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/satnav-scope-cvaa rev-parse HEAD)" = b124c39e5343b24dd5b546a0c279a1c06360bdad
          git worktree add --detach /tmp/satnav-scope-baseline 19737b9975495aebb4bd247e39c6509151fb576f
          set +e
          node /tmp/satnav-scope-cvaa/inoculate.mjs /tmp/satnav-scope-baseline --no-write --json > /tmp/satnav-scope-receipts/baseline.log 2>&1
          baseline_exit=$?
          node /tmp/satnav-scope-cvaa/inoculate.mjs "$PWD" --no-write --json > /tmp/satnav-scope-receipts/candidate.log 2>&1
          candidate_exit=$?
          set -e
          echo "CVAA actual exits: baseline=$baseline_exit candidate=$candidate_exit"
          export BASELINE_EXIT="$baseline_exit" CANDIDATE_EXIT="$candidate_exit"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/satnav-scope-receipts')
          def read(name):
              lines=(p/(name+'.log')).read_text().splitlines()
              for line in reversed(lines):
                  if line.startswith('{"schema":"cvaa.run.v1"'):
                      result=json.loads(line)
                      assert len(result['results'])==46, 'CVAA registry results incomplete'
                      assert not result['shallow']
                      return result
              raise AssertionError('No CVAA result: '+name+' '+str(lines[-10:]))
          a,b=read('baseline'),read('candidate')
          def counts(d):
              return {s:sum(x['state']==s for x in d['results']) for s in ['fail','warn','skipped','immune']}
          def issues(d):
              return {(r['vaccine'],r['level'],f) for r in d['results'] for f in r['findings']}
          new=sorted(issues(b)-issues(a))
          receipt={'registry':'b124c39e5343b24dd5b546a0c279a1c06360bdad','baseline':counts(a),'candidate':counts(b),'baseline_exit':int(os.environ['BASELINE_EXIT']),'candidate_exit':int(os.environ['CANDIDATE_EXIT']),'new_findings':new,'candidate_results':b['results']}
          (p/'cvaa-comparison.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='candidate_results'},indent=2),flush=True)
          assert receipt['baseline_exit'] in (0,1) and receipt['candidate_exit'] in (0,1)
          assert not new,'New CVAA findings'
          print('PASS CVAA non-regression; existing findings remain explicitly recorded, not immunity.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: landing-cvaa-receipts
          path: /tmp/satnav-scope-receipts/
          if-no-files-found: warn
          retention-days: 14
