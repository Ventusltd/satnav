name: SatNav contract and geodesy tests
on:
  push:
    branches: ['agent22/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test nav/contracts.test.mjs
      - run: node vendor/grid-distance-maths/test/verify.mjs
      - run: node --check nav/app.mjs
